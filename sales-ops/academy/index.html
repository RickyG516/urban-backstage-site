<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Academy — UNC Sales Ops</title>
  <link rel="stylesheet" href="/sales-ops/shared/cockpit-shell.css?v=43" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    body{background:var(--color-dark);}
    .ac-wrap{max-width:860px;margin:0 auto;padding:1.5rem 1.25rem;}
    .ac-title{font-family:var(--font-head,'Montserrat',sans-serif);font-weight:800;letter-spacing:0.16em;color:var(--color-white);font-size:1.05rem;}
    .ac-title .tag{color:var(--color-accent);font-size:0.7rem;letter-spacing:0.25em;margin-left:0.5rem;}
    .ac-sub{font-size:0.78rem;color:var(--color-white-dim);margin:0.3rem 0 1.4rem;}
    .card{background:var(--color-dark-2);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:1.4rem;margin-bottom:1rem;}
    .scenario-tag{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent);margin-bottom:0.5rem;}
    .prospect-line{font-size:1.08rem;color:var(--color-white);font-style:italic;line-height:1.6;margin-bottom:1.1rem;}
    .prospect-line::before{content:'📞 THE PROSPECT SAYS: ';font-style:normal;font-size:0.62rem;letter-spacing:0.12em;color:var(--color-white-dim);display:block;margin-bottom:0.4rem;}
    .opt{display:block;width:100%;text-align:left;background:var(--color-dark);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-white);font-size:0.9rem;line-height:1.55;padding:0.8rem 1rem;margin-bottom:0.55rem;cursor:pointer;transition:border-color .15s;font-family:inherit;}
    .opt:hover{border-color:var(--color-accent);}
    .opt.correct{border-color:#22c55e;background:rgba(34,197,94,0.08);}
    .opt.wrong{border-color:#ef4444;background:rgba(239,68,68,0.07);}
    .opt:disabled{cursor:default;}
    .coach{margin-top:0.9rem;padding:0.8rem 1rem;background:rgba(96,165,250,0.08);border-left:3px solid #60a5fa;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:0.82rem;color:#93c5fd;line-height:1.6;}
    .progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-size:0.72rem;color:var(--color-white-dim);letter-spacing:0.08em;text-transform:uppercase;}
    .score{color:var(--color-accent);font-weight:700;}
    .next-btn{background:var(--color-accent);border:none;color:#fff;font-family:var(--font-head,'Montserrat',sans-serif);font-weight:700;letter-spacing:0.08em;padding:0.7rem 1.6rem;border-radius:var(--radius-sm);cursor:pointer;margin-top:1rem;font-size:0.85rem;}
    .cert{text-align:center;padding:2.5rem 1.5rem;}
    .cert h2{font-family:var(--font-head,'Montserrat',sans-serif);font-weight:800;font-size:1.6rem;letter-spacing:0.1em;color:#22c55e;margin:0.5rem 0;}
    .cert.fail h2{color:var(--color-accent);}
    .cert p{color:var(--color-white-dim);font-size:0.9rem;line-height:1.6;max-width:520px;margin:0.6rem auto;}
    .cert .badge{font-size:3.2rem;}
    .name-input{background:var(--color-dark);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-white);font-size:0.95rem;padding:0.65rem 0.9rem;width:280px;max-width:100%;text-align:center;margin:0.6rem 0;}
    .intro-rules{text-align:left;max-width:560px;margin:1rem auto;font-size:0.85rem;color:var(--color-white);line-height:1.7;}
    .intro-rules b{color:var(--color-accent);}
  </style>
  <script src="/sales-ops/shared/nav-shell.js?v=40" defer></script>
</head>
<body>
<main class="cockpit">
  <div class="ac-wrap">
    <div class="ac-title">UNC — ACADEMY <span class="tag">// CERTIFICATION</span></div>
    <div class="ac-sub">The gauntlet. 12 live-fire scenarios. Score 10+ and you're certified to dial. There is no partial credit on a phone call.</div>
    <div id="stage"></div>
  </div>
</main>

<script>
(function(){
  'use strict';

  // Every scenario enforces a non-negotiable: deflect-up, no results promises,
  // their-words-first, outcomes-not-mechanics, underpromise, clean exits.
  var Q=[
    {tag:'THE TECH CORNER', p:'"Okay but how does the SEO actually work? Like what do you actually DO to my website?"',
     opts:[
      {t:'"Great question — we optimize your meta tags, build citations, fix your schema markup, and improve your Core Web Vitals scores."',ok:false},
      {t:'"Honestly, the how is a whole document — and I\'d be doing you a disservice winging it on the phone. That\'s exactly what the written proposal walks through, page by page. What I can tell you is the outcome: when someone in your town Googles your trade at 11 PM, you\'re one of the first three names they see. Fair?"',ok:true},
      {t:'"It\'s pretty technical, you probably don\'t need the details. Just trust me, it works."',ok:false}],
     coach:'Diagnostician, not mechanic. The rep who explains mechanics live gets cornered by the follow-up question they can\'t answer. Route every "how" UP to the written proposal — and hand back an OUTCOME, not a mechanism. Option 1 sounds smart and loses the room. Option 3 is dismissive. Option 2 keeps you the doctor, not the parts guy.'},
    {tag:'THE TIMELINE TRAP', p:'"If I sign up today, when do I start seeing results?"',
     opts:[
      {t:'"Most of our clients see results in 60 to 90 days, some even faster."',ok:false},
      {t:'"Tomorrow. You\'ll notice more calls within the first week."',ok:false},
      {t:'"Here\'s what I\'ll promise you, because it\'s what I control: you\'ll see the new site by end of week two, and every Monday you\'ll get an update showing exactly what got done. What I won\'t do is promise you a date the phone starts ringing — anyone who does is guessing with your money. This compounds; it isn\'t instant."',ok:true}],
     coach:'Results-timing promises are banned — not because they sound bad, but because the rep who makes them owns a clock they don\'t control. Promise DELIVERABLES and cadence (you control those), never outcomes-by-a-date. Underpromise now = every future win lands as a win instead of a relief.'},
    {tag:'OPEN ON THEIR WORDS', p:'An inbound lead wrote on the form: "website looks old, not getting calls like we used to." You get them on the phone. Best opener?',
     opts:[
      {t:'"Hey, this is [you] from Urban Niche Co. — we\'re a full-service digital marketing agency for contractors, and I\'d love to tell you about our packages."',ok:false},
      {t:'"Hey, [you] with Urban Niche — you wrote that the site looks old and the calls slowed down. Tell me about that — when did you start noticing it?"',ok:true},
      {t:'"Hey! Thanks so much for filling out our form, we really appreciate the interest. Do you have a few minutes to hear about what we do?"',ok:false}],
     coach:'Hand them their own words back. They told you the problem — opening with your agency pitch throws that gift away, and "thanks so much for the interest" hands them the high ground. Their words, then a question. You become the guy who listened, and everyone else who called them today is a brochure.'},
    {tag:'THE PRICE FLINCH', p:'You quote $2,800/month. Silence. Then: "...that\'s a lot of money, man."',
     opts:[
      {t:'"I hear you. What\'s your average job worth? ... Okay — at $8K a job and your margins, this pays for itself at one extra job a month. The real question isn\'t whether $2,800 is a lot. It\'s how many jobs the current setup is losing you."',ok:true},
      {t:'"I totally understand. We do have cheaper packages — I could do $1,500, or honestly I could knock a few hundred off if that helps."',ok:false},
      {t:'"It\'s actually pretty competitive — most agencies charge $3,500 or more for less than this."',ok:false}],
     coach:'Never absorb the flinch by dropping price — instant discounting teaches them the number was fake. Re-anchor to THEIR job math: their ticket, their margin, jobs-to-cover. Option 3 argues about agencies when the only math that matters is theirs.'},
    {tag:'SEND ME SOMETHING', p:'"Just send me some information and I\'ll take a look."',
     opts:[
      {t:'"Absolutely! I\'ll email our brochure and pricing sheet right now. What\'s the best address?"',ok:false},
      {t:'"I can do that — but real talk, that PDF ends up in the same folder as everyone else\'s. Here\'s a better use of both our time: give me 15 minutes Thursday, I\'ll walk you through what I found on your actual listing, and THEN I\'ll send the write-up so it means something. Morning or afternoon?"',ok:true},
      {t:'"We don\'t really do brochures. Our stuff doesn\'t work that way."',ok:false}],
     coach:'"Send me info" is a polite hang-up 90% of the time. Don\'t refuse it (option 3 is combative) — convert it. Agree, then trade up to a real step with a concrete reason the info lands better after a conversation. If they still want info only, log INFO_REQUESTED and follow up — that\'s a real outcome, not a loss.'},
    {tag:'THE GATEKEEPER', p:'"He\'s out on a job site. I just take messages." You need the owner of a roofing company.',
     opts:[
      {t:'"No problem — when\'s he usually back at the shop? Early mornings? ... Perfect, I\'ll try him tomorrow around 7:30. And just so I don\'t waste his time — is he the one who handles anything to do with how the company shows up on Google? Appreciate you — what was your name?"',ok:true},
      {t:'"It\'s really important that I speak with him today. Can you give me his cell?"',ok:false},
      {t:'"Okay, can you tell him Urban Niche Co. called about a marketing opportunity? We\'re offering a free audit this week only."',ok:false}],
     coach:'The gatekeeper can\'t say yes — but they can say no. Goals: callback window, confirm the DM, get the gatekeeper\'s NAME (use it on the callback — "Hey Deb, it\'s me again"). Pressing for a cell number burns the bridge; leaving a "marketing opportunity" message guarantees it never gets delivered.'},
    {tag:'THE COMPLACENT KING', p:'"I\'ve been in business 22 years and I stay plenty busy off word of mouth. Don\'t need any of this internet stuff."',
     opts:[
      {t:'"That\'s awesome — but word of mouth is dying. Everything\'s online now, and businesses that don\'t adapt get left behind."',ok:false},
      {t:'"22 years of referrals — that means the work speaks for itself, and honestly that\'s the hardest part of my job already done. One question though: when one of those referrals hears your name at a barbecue, what\'s the first thing they do before calling you? ... Right. They Google you. What do they find?"',ok:true},
      {t:'"Fair enough — sounds like you\'re all set. I\'ll take you off our list."',ok:false}],
     coach:'Never attack the thing they\'re proud of — 22 years of referrals is his identity. Honor it, then show him referrals and Google aren\'t competitors: every referral GETS GOOGLED before the call happens. His own process proves your point. Option 1 insults him; option 3 quits a call that had a real opening.'},
    {tag:'BURNED BEFORE', p:'"We tried one of you guys two years ago. Paid $1,200 a month for a year and got nothing. Never again."',
     opts:[
      {t:'"That wasn\'t us though. We\'re different — our results speak for themselves."',ok:false},
      {t:'"That\'s rough, and honestly I hear that story a lot. Can I ask what they were actually doing for the $1,200? ... See, that\'s the tell — you couldn\'t answer, because they never showed you. Whatever you decide about me, your next rule should be: never pay anyone who can\'t show you what they did every single week."',ok:true},
      {t:'"I get it, but you can\'t judge the whole industry off one bad agency. Give us a chance to prove ourselves."',ok:false}],
     coach:'The burned prospect isn\'t objecting to YOU — he\'s protecting himself from a repeat. Don\'t defend the industry or beg for a chance. Diagnose the old failure (usually: no visibility into the work) and hand him a defense rule that happens to be the thing you already do (Monday updates). You become the guy who armed him, not the next guy selling him.'},
    {tag:'LET ME THINK ABOUT IT', p:'End of a good discovery call. "This all sounds good... let me think it over and I\'ll get back to you."',
     opts:[
      {t:'"Sure, take all the time you need. I\'ll check back in a couple weeks?"',ok:false},
      {t:'"Of course. Help me out though — when a guy says that to me it\'s usually one of three things: the price, the timing, or whether it\'ll actually work for your shop. Which one is doing the thinking?"',ok:true},
      {t:'"I understand — but this pricing is only good through Friday, so you\'d want to decide quick."',ok:false}],
     coach:'"Think it over" is a fog bank, not an answer. Name the three real possibilities out loud and let him pick — whichever he names, you now have a real conversation instead of a callback that never connects. Fake deadlines (option 3) torch trust with contractors; they can smell it instantly.'},
    {tag:'SPEED TO LEAD', p:'A form lead comes in while you\'re mid-lunch: submitted 2 minutes ago, phone number included. What\'s the move?',
     opts:[
      {t:'Finish lunch, then send a polished intro email so you don\'t seem desperate, and call tomorrow morning during the best dial window.',ok:false},
      {t:'Call RIGHT NOW. They\'re probably still on the website. First voice on the phone usually wins the job — sound glad they reached out, quote their form message back, ask one question.',ok:true},
      {t:'Wait an hour so you don\'t look like you were sitting by the phone, then call.',ok:false}],
     coach:'Inbound decays by the minute — under 5 minutes they\'re still on your site, after an hour they\'re on a competitor\'s. Calling instantly isn\'t desperate, it\'s the single strongest professionalism signal you can send: "this is how fast they\'ll answer when MY customers call them." Best-dial-window rules are for COLD calls, never inbound.'},
    {tag:'THE PARTNER STALL', p:'"I like it, but I gotta run it by my wife — she does the books."',
     opts:[
      {t:'"Totally get it — she\'s the CFO. Two options: I hop on a 10-minute call with both of you tomorrow so she can grill me directly, or I send you a one-pager built for the person who watches the money — the numbers, what it costs, what it has to produce to pay for itself. Which works better?"',ok:true},
      {t:'"Sure, talk it over and call me back whenever."',ok:false},
      {t:'"What is there to run by her? You\'re the one running the business day-to-day, right?"',ok:false}],
     coach:'The partner is a real decision-maker, not an excuse (usually). Respect the structure and ARM the conversation — get in the room, or equip him with the exact math she\'ll ask about. Option 3 disrespects his marriage and his business in one sentence. Option 2 sends your deal into a conversation you\'re not part of, with no ammunition.'},
    {tag:'THE CLEAN EXIT', p:'Ten minutes in, it\'s clear: he\'s a one-man handyman operation, $40 tickets, no budget, not a fit. He\'s a nice guy. What now?',
     opts:[
      {t:'Pitch the cheapest thing anyway — $250 GBP setup — so the call isn\'t a total loss.',ok:false},
      {t:'"Honestly, based on what you\'ve told me, I\'m not the right spend for you right now — and I\'d rather say that than take your money. Here\'s what I\'d do free: claim your Google profile, get your 10 best customers to leave reviews. If you grow into needing more, you know where I am."',ok:true},
      {t:'Wrap up fast: "Okay, well, someone will follow up with you." Log it and move on.',ok:false}],
     coach:'A clean exit is a long-term asset. Contractors talk to each other constantly — the guy who told him the truth and gave him a free plan is the guy who gets the referral when his roofer buddy complains about the phone not ringing. Squeezing a $250 sale out of a bad-fit client buys you a churn, a bad review, or both.'}
  ];

  var stage=document.getElementById('stage');
  var order=[],idx=0,score=0,answered=false;

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function renderIntro(){
    stage.innerHTML='<div class="card cert"><div class="badge">🎓</div>'
      +'<h2 style="color:var(--color-white)">THE GAUNTLET</h2>'
      +'<div class="intro-rules">'
      +'<p><b>12 scenarios.</b> Real objections, real stalls, real corners — the exact moments that decide whether a call dies or closes.</p>'
      +'<p><b>Pass = 10 of 12.</b> Every answer shows you the why, so even a miss makes you sharper.</p>'
      +'<p><b>The rules being tested:</b> deflect tech questions up, never promise results by a date, open on their words, sell outcomes not mechanics, underpromise, exit clean.</p>'
      +'</div>'
      +'<input class="name-input" id="rep-name" placeholder="Your name" maxlength="40" />'
      +'<br><button class="next-btn" id="start-btn">START THE GAUNTLET →</button></div>';
    document.getElementById('start-btn').addEventListener('click',function(){
      var n=(document.getElementById('rep-name').value||'').trim();
      if(!n){document.getElementById('rep-name').style.borderColor='#ef4444';return;}
      try{localStorage.setItem('unc_academy_name',n);}catch(e){}
      order=shuffle(Q.map(function(_,i){return i;}));
      idx=0;score=0;renderQ();
    });
  }

  function renderQ(){
    answered=false;
    var q=Q[order[idx]];
    var opts=shuffle(q.opts.map(function(o,i){return{t:o.t,ok:o.ok,i:i};}));
    stage.innerHTML='<div class="progress"><span>Scenario '+(idx+1)+' of '+Q.length+'</span><span class="score">Score: '+score+'</span></div>'
      +'<div class="card"><div class="scenario-tag">'+esc(q.tag)+'</div>'
      +'<div class="prospect-line">'+esc(q.p)+'</div>'
      +opts.map(function(o,i){return '<button class="opt" data-ok="'+(o.ok?'1':'0')+'" data-i="'+i+'">'+esc(o.t)+'</button>';}).join('')
      +'<div id="coach-slot"></div><div id="next-slot"></div></div>';
    Array.prototype.forEach.call(stage.querySelectorAll('.opt'),function(btn){
      btn.addEventListener('click',function(){
        if(answered)return;answered=true;
        var right=btn.dataset.ok==='1';
        if(right)score++;
        Array.prototype.forEach.call(stage.querySelectorAll('.opt'),function(b){
          b.disabled=true;
          if(b.dataset.ok==='1')b.classList.add('correct');
          else if(b===btn)b.classList.add('wrong');
        });
        document.querySelector('.score').textContent='Score: '+score;
        document.getElementById('coach-slot').innerHTML='<div class="coach">🎓 '+esc(q.coach)+'</div>';
        document.getElementById('next-slot').innerHTML='<button class="next-btn" id="next-btn">'+(idx+1<Q.length?'NEXT SCENARIO →':'SEE YOUR RESULT →')+'</button>';
        document.getElementById('next-btn').addEventListener('click',function(){
          idx++;
          if(idx<Q.length)renderQ();else renderResult();
        });
        document.getElementById('next-btn').scrollIntoView({behavior:'smooth',block:'center'});
      });
    });
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function renderResult(){
    var name='';try{name=localStorage.getItem('unc_academy_name')||'';}catch(e){}
    var passed=score>=10;
    var when=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    if(passed){
      try{localStorage.setItem('unc_academy_certified',JSON.stringify({name:name,score:score,date:when}));}catch(e){}
      stage.innerHTML='<div class="card cert"><div class="badge">🏅</div><h2>CERTIFIED</h2>'
        +'<p style="color:var(--color-white);font-size:1.05rem;"><b>'+esc(name)+'</b> — '+score+'/'+Q.length+' · '+esc(when)+'</p>'
        +'<p>You just proved you can hold the frame in the 12 moments where most reps fold. Screenshot this and send it to Ricky — then go put it on a live dial.</p>'
        +'<p style="color:var(--color-accent);font-weight:700;">One contractor. One yes. Go get it.</p>'
        +'<button class="next-btn" id="again-btn">RUN IT AGAIN</button></div>';
    }else{
      stage.innerHTML='<div class="card cert fail"><div class="badge">🔨</div><h2>NOT YET — '+score+'/'+Q.length+'</h2>'
        +'<p>Pass is 10. That\'s not gatekeeping — it\'s because a prospect doesn\'t give partial credit either. Re-read the coaching notes on the ones you missed; every wrong answer up there is a real call that died somewhere.</p>'
        +'<p>The reps who pass on attempt two are usually sharper than the ones who pass on attempt one. Run it back.</p>'
        +'<button class="next-btn" id="again-btn">RUN IT BACK →</button></div>';
    }
    document.getElementById('again-btn').addEventListener('click',function(){order=shuffle(Q.map(function(_,i){return i;}));idx=0;score=0;renderQ();});
  }

  renderIntro();
})();
</script>
</body>
</html>
