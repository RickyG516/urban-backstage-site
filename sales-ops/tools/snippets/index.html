<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <script>
    (function() {
      var w = (window.screen && window.screen.width) || window.innerWidth;
      if (w < 600 || /iPhone|Android.*Mobile|iPod/i.test(navigator.userAgent)) document.documentElement.setAttribute('data-mobile', 'phone');
      else if (w < 900) document.documentElement.setAttribute('data-mobile', 'tablet');
    })();
  </script>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Snippet Library — Sales Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/sales-ops/shared/cockpit-shell.css?v=43" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    .snip { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .snip__tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .snip__tab { padding: 0.6rem 1rem; background: var(--color-white-faint); border: 1px solid var(--color-border-bright); border-radius: var(--radius-pill); cursor: pointer; font-family: var(--font-display); font-size: 0.78rem; font-weight: 700; color: var(--color-white); }
    .snip__tab.active { background: var(--color-accent); color: var(--color-black); border-color: var(--color-accent); }
    .snip__group { display: none; }
    .snip__group.active { display: block; }
    .snip__card { background: var(--color-dark-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.25rem 1.5rem; margin-bottom: 0.85rem; border-left: 3px solid var(--color-accent); cursor: pointer; transition: all var(--transition-fast); }
    .snip__card:hover { border-color: var(--color-accent); background: var(--color-accent-glow); }
    .snip__intent { font-family: var(--font-display); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 0.4rem; }
    .snip__text { font-family: var(--font-display); font-size: 1rem; line-height: 1.55; color: var(--color-white); }
    .snip__hint { font-size: 0.72rem; color: var(--color-white-dim); margin-top: 0.5rem; }
  </style>
<!-- HubSpot Tracking Code -->
<script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/245833525.js"></script>
</head>
<body>
  <main class="cockpit">
    <section class="snip">
      <div class="dash__header">
        <div>
          <h1 class="dash__title">Snippet Library</h1>
          <p class="dash__sub">Power phrases organized by intent. Click any snippet to copy. Use mid-call when you're searching for the right line.</p>
        </div>
      </div>
      <div class="snip__tabs" id="tabs"></div>
      <div id="groups"></div>
    </section>
    <div class="brand-stamp">
      <div class="brand-stamp__top">Urban Niche Co. | urbannicheco.com | (515) 344-4053</div>
      <div class="brand-stamp__tag">Marketing built for contractors. Let's build something.</div>
    </div>
  </main>
  <script src="/sales-ops/shared/nav-shell.js?v=40" defer></script>
  <script>
    const SNIPPETS = {
      'Opens': [
        { intent: 'Permission-based cold open', text: 'This is a cold call. Want to hear what I have to say in 30 seconds, or should we hang up and never waste each other\'s time again?', hint: 'Pattern interrupt. Forces a yes/no.' },
        { intent: 'Honest cold open', text: 'I\'m gonna be straight with you — this is a cold call from a marketing guy. Hang up if you want, or give me 30 seconds and I\'ll tell you why I called specifically you.', hint: 'Disarming honesty.' },
        { intent: 'Qualifier-first open', text: 'Real quick before I get into why I called — are you the one who handles marketing for [business], or is that somebody else?', hint: 'Identifies DM before pitch.' },
        { intent: 'Inbound callback', text: 'I wanted to catch you while it\'s fresh. Got 5 minutes?', hint: 'Speed-to-lead opener.' }
      ],
      'Qualifiers': [
        { intent: 'Timing qualifier', text: 'Are you looking to fix this in the next 30 days, or is this more research-mode for later?', hint: 'Separates buyers from browsers.' },
        { intent: 'Decision-maker check', text: 'On the marketing side — are you the one who decides this, or is there a partner also in the conversation?', hint: 'Avoid surprise no\'s later.' },
        { intent: 'Budget signal', text: 'Most contractors we work with are investing $1,500 to $7,500 a month depending on how aggressive they want to be', hint: 'Sets price expectation.' },
        { intent: 'Current spend', text: 'What\'s your current customer acquisition cost? Including ads, your website, anyone helping you.', hint: 'Anchor your value.' }
      ],
      'Hooks': [
        { intent: 'Storm-season roofer', text: 'When the next hailstorm rolls through, do you know how you stack up against storm-chasers paying $90 a click?', hint: 'Roofer-specific urgency.' },
        { intent: 'Emergency HVAC', text: 'When it hits 95° next month and somebody\'s AC dies, do you show up first on Google or are you the third name they call?', hint: 'HVAC seasonal pain.' },
        { intent: 'Visual trades', text: 'Your work looks 10x better in person than on your website. Want me to show you what that\'s costing you?', hint: 'Painters, landscapers, masons.' },
        { intent: 'Cost-of-inaction', text: 'If this stays exactly how it is for the next 12 months, what does that cost you?', hint: 'Quantify the bleed.' },
        { intent: 'Competitor awareness', text: 'Are your competitors gaining ground on you online while you\'re stuck running the same playbook?', hint: 'Loss-aversion frame.' }
      ],
      'Objection Handlers': [
        { intent: 'Price too high', text: 'Fair. What\'s your current customer acquisition cost? Most contractors I talk to are paying $200-400 per lead. We typically bring it to $50-80. The question isn\'t whether you can afford this — it\'s whether you can afford not to.', hint: 'Reframe price as cost-of-status-quo.' },
        { intent: 'Need to think', text: 'Of course. What part are you actually thinking through — price, timing, whether it works for your situation, or trust?', hint: 'Forces specificity. Defeats stalling.' },
        { intent: 'Already have agency', text: 'Cool. What specifically do they handle? Most in-house setups cover one piece — usually social or website — but miss the high-leverage stuff.', hint: 'Identifies gaps in their current setup.' },
        { intent: 'Slow season excuse', text: 'Honestly, slow season is the BEST time. By the time busy season hits, SEO has compounded, ads are dialed in, and you ride the wave instead of scrambling.', hint: 'Reverses timing objection.' },
        { intent: 'Trust concern', text: 'I\'ll show you 3 case studies from contractors in your region. If they don\'t look like results you\'d want, I\'ll save us both the time.', hint: 'Lowers risk perception.' }
      ],
      'Closes': [
        { intent: 'Soft binary close', text: 'Two options — I send you a written proposal you review on your own, OR we book a 30-minute walkthrough where I screen-share. Which works better?', hint: 'Avoids the no.' },
        { intent: 'Direct ask', text: 'Want to start tomorrow? I can have your setup launched by end of day.', hint: 'For HOT prospects only.' },
        { intent: 'Reversal close', text: 'I\'m going to send you the proposal even if you say no, because I want you to see what you\'re leaving on the table. Cool?', hint: 'Disarms with confidence.' },
        { intent: 'Timeline forcing function', text: 'Hailstorm season is 6 weeks out. If we\'re going to be ready, we need to start setup in the next 10 days. Want to lock that in?', hint: 'Creates urgency without manufacturing it.' },
        { intent: 'Calendar close', text: 'What\'s better — today around 3 or tomorrow morning?', hint: 'Specific times beat "when works for you."' }
      ],
      'Exits': [
        { intent: 'Graceful no', text: 'Got it — sounds like we\'re not the right fit right now. Wishing you the best. If anything changes, you have my number.', hint: 'Burns no bridges.' },
        { intent: 'Honest no-fit', text: 'Honestly, based on what you just told me, I don\'t think I\'m the right call right now. Here\'s why — [reason]. Glad we figured it out fast.', hint: 'Earns respect.' },
        { intent: 'Wrong number polite', text: 'My mistake — wrong number. Have a good one.', hint: 'Don\'t linger.' },
        { intent: 'Soft re-engage offer', text: 'I\'ll send a 90-second audit on your business to your email. You can ignore it or not. Cool?', hint: 'Plants a seed.' }
      ],
      'Voicemail': [
        { intent: 'Skip-VM text-pivot', text: 'Hey [name], {rep_name} from Urban Niche Co. — I won\'t leave a voicemail, I\'ll text you the 30-second reason instead. Watch for a text from {rep_phone}.', hint: 'Voicemails get skipped. Texts get read.' },
        { intent: 'Inbound callback VM', text: 'Hey [name], {rep_name} from Urban Niche — calling back on the form you filled out. Text me at {rep_phone} with a good time and I\'ll do a free 90-second audit before we hop on.', hint: 'Adds value before the conversation.' }
      ]
    };
    // Load active rep for token interpolation in snippet texts
    let _rep = { display_name: 'Ricky', phone: '(515) 344-4053' };
    function interpSnippet(t) {
      return t.replace(/\{rep_name\}/g, _rep.display_name || 'Ricky')
              .replace(/\{rep_phone\}/g, _rep.phone || '(515) 344-4053');
    }
    (async function() {
      try {
        const data = await fetch('/sales-ops/shared/reps.json', { cache: 'no-cache' }).then(r => r.json());
        const savedId = (function(){ try { const v=localStorage.getItem('unc_cockpit_current_rep_id'); return v ? JSON.parse(v) : null; } catch(e){ return null; } })();
        const match = data.reps.find(r => r.active && r.id === savedId) || data.reps.find(r => r.active);
        if (match) { _rep = match; renderSnippets(); }
      } catch(e) {}
    })();

    const cats = Object.keys(SNIPPETS);
    const tabs = document.getElementById('tabs');
    const groups = document.getElementById('groups');

    function renderSnippets() {
      tabs.innerHTML = cats.map((c, i) => `<button class="snip__tab ${i === 0 ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('');
      groups.innerHTML = cats.map((c, i) => `<div class="snip__group ${i === 0 ? 'active' : ''}" data-cat="${c}">${
        SNIPPETS[c].map(s => {
          const resolved = interpSnippet(s.text);
          return `<div class="snip__card" data-text="${resolved.replace(/"/g, '&quot;')}">
            <div class="snip__intent">${s.intent}</div>
            <div class="snip__text">"${resolved}"</div>
            <div class="snip__hint">${s.hint} <span style="float:right; opacity:0.6">📋 click to copy</span></div>
          </div>`;
        }).join('')
      }</div>`).join('');
    }
    renderSnippets();
    tabs.addEventListener('click', e => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      tabs.querySelectorAll('.snip__tab').forEach(t => t.classList.remove('active'));
      groups.querySelectorAll('.snip__group').forEach(g => g.classList.remove('active'));
      b.classList.add('active');
      groups.querySelector(`.snip__group[data-cat="${b.dataset.cat}"]`).classList.add('active');
    });
    groups.addEventListener('click', async e => {
      const card = e.target.closest('.snip__card');
      if (!card) return;
      try {
        await navigator.clipboard.writeText(card.dataset.text);
        const orig = card.querySelector('.snip__hint').innerHTML;
        card.querySelector('.snip__hint').innerHTML = '<span style="color:var(--color-green); font-weight:700">✓ Copied to clipboard</span>';
        setTimeout(() => { card.querySelector('.snip__hint').innerHTML = orig; }, 1500);
      } catch(e) {}
    });
  </script>
</body>
</html>
