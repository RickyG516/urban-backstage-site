            <div class="tref__tile-label">Urgency</div>
            <div class="tref__tile-value">${esc(t.urgency)}</div>
          </div>
        </div>
        ${x.stormRule ? `<div class="tref__storm"><b>⛈ Storm rule</b>${esc(x.stormRule)}</div>` : ''}
        ${x.sellAngle ? `<div class="tref__angle"><b>How to sell this trade</b>${esc(x.sellAngle)}</div>` : ''}
        <div class="tref__cols">
          <div class="tref__col-card">
            <div class="tref__section">
              <div class="tref__heading">Quick facts</div>
              <div class="tref__row"><span>Avg ticket</span><span>${t.avgTicket}</span></div>
              <div class="tref__row"><span>Decision maker</span><span>${t.dm}</span></div>
            </div>
            <div class="tref__section" style="margin-bottom:0">
              <div class="tref__heading">Top channels that work</div>
              <ul class="tref__list">${t.topChannels.map(c => '<li>' + esc(c) + '</li>').join('')}</ul>
            </div>
          </div>
          <div class="tref__col-card">
            <div class="tref__section">
              <div class="tref__heading">Key metrics they care about</div>
              <ul class="tref__list">${t.keyMetrics.map(m => '<li>' + esc(m) + '</li>').join('')}</ul>
            </div>
            <div class="tref__section" style="margin-bottom:0">
              <div class="tref__heading">Common pains</div>
              <ul class="tref__list">${t.commonPains.map(p => '<li>' + esc(p) + '</li>').join('')}</ul>
            </div>
          </div>
        </div>
        <div class="tref__section" style="margin-bottom:0">
          <div class="tref__heading">Hook lines on a cold call</div>
          <ul class="tref__list">${t.hookLines.map(h => '<li style="color:var(--color-accent)">"' + esc(h) + '"</li>').join('')}</ul>
        </div>
      `;
    }
    const nav = document.getElementById('tref-nav');
    nav.innerHTML = Object.keys(TRADES).map((t, i) => `<button class="tref__chip ${i === 0 ? 'active' : ''}" data-trade="${t}">${t}</button>`).join('');
    nav.addEventListener('click', e => {
      const b = e.target.closest('[data-trade]');
      if (!b) return;
      document.querySelectorAll('.tref__chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.trade);
    });
    render(Object.keys(TRADES)[0]);
  </script>
</body>
</html>
