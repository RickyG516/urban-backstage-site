<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UNC — Prospect Intelligence</title>
<script src="/sales-ops/shared/d3.min.js"></script>
<script src="/sales-ops/shared/topojson.min.js"></script>
<style>
:root {
  --orange:#e36b1e; --hot:#ff4040; --warm:#e36b1e; --cold:#38bdf8;
  --bg:#030712; --panel:rgba(3,7,18,0.94); --border:rgba(56,189,248,0.15);
  --cyan:#38bdf8; --purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Courier New',monospace;color:#fff;}

/* ── CURSOR ── */
*{cursor:none!important;}
#crosshair{
  position:fixed;width:32px;height:32px;pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(56,189,248,0.8);}
#crosshair::before{width:1px;height:100%;left:50%;top:0;}
#crosshair::after{width:100%;height:1px;top:50%;left:0;}
.ch-ring{
  position:absolute;inset:4px;border:1px solid rgba(56,189,248,0.4);
  border-radius:50%;animation:chpulse 2s ease-in-out infinite;
}
@keyframes chpulse{0%,100%{transform:scale(1);opacity:0.4;}50%{transform:scale(1.15);opacity:0.8;}}

/* ── SCANLINES ── */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:800;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
}

/* ── GRID BG ── */
#grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(56,189,248,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.03) 1px,transparent 1px);
  background-size:48px 48px;
}

/* ── MAP SVG ── */
#map{position:absolute;inset:0;width:100%;height:100%;z-index:1;}

/* ── HEADER ── */
#header{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:50;
  background:linear-gradient(180deg,rgba(3,7,18,0.98),transparent);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.brand-block .brand{font-size:0.65rem;font-weight:700;letter-spacing:0.28em;color:var(--orange);text-transform:uppercase;}
.brand-block .sub{font-size:0.42rem;letter-spacing:0.18em;color:rgba(56,189,248,0.4);text-transform:uppercase;margin-top:2px;}
#clock{font-size:0.58rem;letter-spacing:0.1em;color:rgba(56,189,248,0.5);}

/* ── STAT BAR ── */
#stat-bar{
  position:absolute;top:52px;left:0;right:0;z-index:50;
  display:flex;border-bottom:1px solid var(--border);
  background:rgba(3,7,18,0.88);backdrop-filter:blur(10px);
}
.st{
  flex:1;padding:9px 0 7px;text-align:center;border-right:1px solid var(--border);
  position:relative;overflow:hidden;transition:background 0.2s;
}
.st:last-child{border-right:none;}
.st:hover{background:rgba(56,189,248,0.03);}
.st-val{font-size:1.35rem;font-weight:700;letter-spacing:0.03em;line-height:1;}
.st-lbl{font-size:0.4rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-top:3px;}
.st-bar{position:absolute;bottom:0;left:0;height:2px;width:0%;transition:width 1.4s cubic-bezier(0.4,0,0.2,1);}

/* ── FILTER BAR ── */
#filter-bar{
  position:absolute;right:0;top:52px;z-index:60;
  display:flex;flex-direction:column;gap:3px;align-items:stretch;
  padding:8px 6px;width:72px;
  background:rgba(3,7,18,1);border-left:1px solid var(--border);
}
.ftag{
  padding:4px 4px;border-radius:3px;font-size:0.38rem;font-weight:700;
  letter-spacing:0.10em;text-transform:uppercase;cursor:none;
  border:1px solid rgba(56,189,248,0.2);color:rgba(56,189,248,0.5);
  background:transparent;transition:all 0.15s;text-align:center;
}
.ftag:hover,.ftag.on{border-color:var(--cyan);color:var(--cyan);background:rgba(56,189,248,0.08);}
.ftag.all.on{border-color:var(--orange);color:var(--orange);background:rgba(227,107,30,0.08);}
#conquest-btn{
  padding:3px 10px;border-radius:3px;font-size:0.42rem;font-weight:700;
  letter-spacing:0.12em;text-transform:uppercase;cursor:none;
  border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);
  background:transparent;transition:all 0.15s;white-space:nowrap;margin-left:4px;
}
#conquest-btn.on{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.08);}

/* ── MAP ELEMENTS ── */
.state-fill{fill:#07101f;stroke:#0c1e38;stroke-width:0.5;transition:fill 0.4s,stroke 0.4s,opacity 0.3s;}
.state-fill.heat1{fill:#081525;}
.state-fill.heat2{fill:#0a1c30;}
.state-fill.heat3{fill:#0d2240;}
.state-fill.heat4{fill:#102850;}
.state-fill.heat5{fill:#143060;}
.state-fill{vector-effect:non-scaling-stroke;}
.state-border{vector-effect:non-scaling-stroke;}
.state-fill.selected{fill:#12233f!important;stroke:rgba(56,189,248,0.9)!important;stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(56,189,248,0.55));}
.state-fill:hover:not(.selected){fill:#0f2030;cursor:none;}
.state-border{fill:none;stroke:rgba(56,189,248,0.1);stroke-width:0.5;pointer-events:none;}

/* ── DOTS ── */
.dot-g{pointer-events:all;}
/* rings driven by JS rAF — no CSS animation */
.ring{fill:none;stroke-width:0.7;opacity:0;}
@keyframes dotin{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.3);}100%{transform:scale(1);opacity:1;}}
.dot-core{animation:dotin 0.4s ease-out forwards;}

/* ── SIGNAL LINES ── */
.signal-line{stroke-width:0.4;opacity:0;pointer-events:none;stroke-dasharray:4 4;}
@keyframes signalin{0%{opacity:0;stroke-dashoffset:100;}50%{opacity:0.4;}100%{opacity:0;stroke-dashoffset:0;}}

/* ── STATE PINS (floating stat cards) ── */
.state-pin-group{pointer-events:none;}
.pin-bg{fill:rgba(3,7,18,0.88);stroke:rgba(56,189,248,0.3);stroke-width:0.5;rx:3;}
.pin-hot{fill:#ff4040;}
.pin-warm{fill:#e36b1e;}
.pin-unt{fill:rgba(255,255,255,0.2);}
.pin-label{font-size:3.8px;fill:rgba(56,189,248,0.8);font-family:'Courier New',monospace;font-weight:700;letter-spacing:0.08em;}
.pin-stem{stroke:rgba(56,189,248,0.3);stroke-width:0.4;}

/* ── CITY LAYER ── */
.city-g{pointer-events:all;}
/* City hover name tag */
.city-hover-tag{
  pointer-events:none;
  font-family:'Courier New',monospace;font-size:0px;font-weight:700;
  fill:#fff;text-anchor:middle;
  filter:drop-shadow(0 0 4px rgba(0,0,0,0.9));
  transition:font-size 0.1s;
}
/* Nearby-cities popover */
#city-popover{
  position:fixed;z-index:200;display:none;
  background:rgba(3,7,18,0.97);border:1px solid rgba(56,189,248,0.35);
  border-radius:7px;padding:8px 0;min-width:180px;max-width:240px;
  box-shadow:0 0 30px rgba(56,189,248,0.08),0 8px 40px rgba(0,0,0,0.85);
}
#city-popover .pop-title{
  font-size:0.38rem;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(56,189,248,0.4);padding:0 12px 6px;border-bottom:1px solid rgba(56,189,248,0.1);
  margin-bottom:4px;
}
.pop-city{
  padding:6px 12px;font-size:0.52rem;letter-spacing:0.04em;cursor:none;
  display:flex;align-items:center;gap:8px;transition:background 0.1s;
}
.pop-city:hover{background:rgba(56,189,248,0.08);}
.pop-city .pc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.pop-city .pc-name{color:#fff;font-weight:700;}
.pop-city .pc-meta{font-size:0.42rem;color:rgba(255,255,255,0.35);margin-left:auto;}
.city-label{font-family:'Courier New',monospace;fill:rgba(255,255,255,0.45);pointer-events:none;}
@keyframes citypin{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
.city-core{animation:citypin 0.35s ease-out forwards;}

/* ── BAR CHART ── */
#city-chart{
  position:absolute;bottom:36px;right:220px;z-index:55;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;width:200px;display:none;
}
#city-chart h5{font-size:0.45rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;}
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.bar-city{font-size:0.42rem;color:rgba(255,255,255,0.4);width:70px;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;background:var(--cyan);transition:width 0.6s ease;}
.bar-n{font-size:0.38rem;color:rgba(56,189,248,0.6);min-width:14px;text-align:right;}

/* ── SIDE PANEL ── */
#side-panel{
  position:absolute;top:89px;left:0;bottom:28px;width:210px;z-index:55;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(-215px);transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);
}
#side-panel.open{transform:translateX(0);}
#panel-hd{
  padding:10px 12px 8px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
#panel-title{font-size:0.55rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--cyan);}
#panel-close{background:none;border:none;color:rgba(255,255,255,0.25);font-size:1rem;cursor:none;line-height:1;padding:0;}
#panel-close:hover{color:#fff;}
#panel-body{flex:1;overflow-y:auto;padding:10px 12px;}
#panel-body::-webkit-scrollbar{width:2px;}
#panel-body::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.15);border-radius:2px;}
.p-section{font-size:0.38rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(56,189,248,0.4);margin:8px 0 5px;}
.c-row{padding:6px 0;border-bottom:1px solid rgba(56,189,248,0.05);}
.c-row:last-child{border-bottom:none;}
.c-name{font-size:0.52rem;font-weight:700;color:#fff;letter-spacing:0.03em;margin-bottom:2px;}
.c-meta{font-size:0.42rem;color:rgba(255,255,255,0.32);letter-spacing:0.05em;}
.c-hook{font-size:0.42rem;color:rgba(227,107,30,0.65);margin-top:2px;letter-spacing:0.03em;}
.badge{display:inline-block;padding:1px 6px;border-radius:2px;font-size:0.38rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border:1px solid;margin-top:3px;}
.pill-row{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px;}

/* ── ZOOM BTNS ── */
#zoom-btns{position:absolute;right:80px;bottom:40px;display:flex;flex-direction:column;gap:5px;z-index:50;}
.zbtn{
  width:30px;height:30px;background:rgba(3,7,18,0.85);
  border:1px solid var(--border);border-radius:4px;
  color:rgba(56,189,248,0.6);font-size:1rem;cursor:none;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.zbtn:hover{background:rgba(56,189,248,0.08);border-color:rgba(56,189,248,0.4);color:var(--cyan);}
.zbtn.sm{font-size:0.42rem;letter-spacing:0.06em;}

/* ── TOOLTIP ── */
#tip{
  position:fixed;z-index:300;pointer-events:none;display:none;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:9px 12px;min-width:145px;box-shadow:0 0 30px rgba(56,189,248,0.06),0 8px 40px rgba(0,0,0,0.8);
}
#tip h4{font-size:0.58rem;color:var(--cyan);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px;}
#tip .tr{font-size:0.5rem;color:rgba(255,255,255,0.38);margin-bottom:3px;letter-spacing:0.04em;}
#tip .tr b{color:#fff;}
#tip .tbadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
#tip .tbadge{font-size:0.36rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;}

/* ── TICKER ── */
#ticker-wrap{
  position:absolute;bottom:0;left:0;right:0;height:28px;z-index:50;
  background:rgba(3,7,18,0.92);border-top:1px solid var(--border);
  display:flex;align-items:center;overflow:hidden;
}
#ticker-lbl{padding:0 12px;font-size:0.42rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--orange);border-right:1px solid var(--border);height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;}
#ticker{white-space:nowrap;font-size:0.45rem;letter-spacing:0.08em;color:rgba(56,189,248,0.5);padding-left:20px;display:inline-block;animation:ticker 80s linear infinite;}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── LOADER ── */
#loader{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity 0.6s;
}
.l-brand{font-size:0.62rem;letter-spacing:0.3em;color:var(--orange);text-transform:uppercase;}
.l-sub{font-size:0.4rem;letter-spacing:0.2em;color:rgba(56,189,248,0.4);text-transform:uppercase;}
.l-bar{width:180px;height:1px;background:rgba(56,189,248,0.1);border-radius:1px;overflow:hidden;}
.l-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--cyan));width:0%;transition:width 0.5s ease;}
.l-msg{font-size:0.4rem;letter-spacing:0.14em;color:rgba(56,189,248,0.3);text-transform:uppercase;}

/* corner brackets on side panel */
.cbr{position:absolute;width:10px;height:10px;pointer-events:none;}
.cbr.tl{top:0;left:0;border-top:1px solid rgba(56,189,248,0.35);border-left:1px solid rgba(56,189,248,0.35);}
.cbr.tr{top:0;right:0;border-top:1px solid rgba(56,189,248,0.35);border-right:1px solid rgba(56,189,248,0.35);}
.cbr.bl{bottom:0;left:0;border-bottom:1px solid rgba(56,189,248,0.35);border-left:1px solid rgba(56,189,248,0.35);}
.cbr.br{bottom:0;right:0;border-bottom:1px solid rgba(56,189,248,0.35);border-right:1px solid rgba(56,189,248,0.35);}
</style>
</head>

<div id="crosshair"><div class="ch-ring"></div></div>

<div id="loader">

<!-- Stat bar -->

  <div class="st"><div class="st-val" id="s-st" style="color:var(--purple)">—</div><div class="st-lbl">States</div><div class="st-bar" style="background:var(--purple)" id="b-st"></div></div>
  <div class="st"><div class="st-val" id="s-hot" style="color:var(--hot)">—</div><div class="st-lbl">🔥 Hot</div><div class="st-bar" style="background:var(--hot)" id="b-hot"></div></div>
  <div class="st"><div class="st-val" id="s-warm" style="color:var(--orange)">—</div><div class="st-lbl">Warm</div><div class="st-bar" style="background:var(--orange)" id="b-warm"></div></div>
  <div class="st"><div class="st-val" id="s-unt" style="color:rgba(255,255,255,0.3)">—</div><div class="st-lbl">Untouched</div><div class="st-bar" style="background:rgba(255,255,255,0.15)" id="b-unt"></div></div>

<!-- Filter bar -->
<div id="filter-bar">

  <button class="ftag" data-trade="Landscaper">LAND</button>
  <button class="ftag" data-trade="General Contractor">GC</button>
  <button class="ftag" data-trade="Remodeler">REMOD</button>
  <button class="ftag" data-trade="Pressure Washing">P-WASH</button>
  <button id="conquest-btn">⚔ CONQUEST</button>
</div>

<svg id="map"></svg>

<!-- Side panel -->
<div id="side-panel">
  <div class="cbr tl"></div><div class="cbr tr"></div><div class="cbr bl"></div><div class="cbr br"></div>
  <div id="panel-hd">
    <span id="panel-title">SELECT A STATE</span>
    <button id="panel-close">×</button>
  </div>
  <div id="panel-body"></div>
</div>

<!-- City bar chart -->
<div id="city-chart"><h5 id="chart-title">contacts by city</h5><div id="chart-rows"></div></div>

<!-- Zoom -->
<div id="zoom-btns">
  <button class="zbtn" id="zi">+</button>
  <button class="zbtn" id="zo">−</button>
  <button class="zbtn sm" id="zr">RST</button>
</div>

<div id="city-popover"><div class="pop-title" id="pop-title">Nearby Cities</div><div id="pop-list"></div></div>
<div id="tip"></div>

<div id="ticker-wrap">
  <div id="ticker-lbl">LIVE INTEL</div>
  <div id="ticker">—</div>
</div>

// ── Audio ─────────────────────────────────────────────────────────────────
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx=null;
function getACtx(){if(!actx)actx=new AudioCtx();return actx;}
function beep(freq=440,dur=0.08,vol=0.06,type='sine'){
  try{const a=getACtx(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.start(a.currentTime);o.stop(a.currentTime+dur);}catch(e){}
}
function pingDot(){beep(880,0.06,0.04,'sine');}
function pingState(){beep(440,0.12,0.08,'sine');beep(660,0.1,0.04,'sine');}
function pingFilter(){beep(1200,0.05,0.03,'square');}

}

async function fetchCRM(){
  try{
    const r=await fetch(WORKER+'/map',{cache:'no-store',headers:{'x-unc-key':WORKER_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.ok)throw new Error(d.error);
    setSrcBadge(true);
    return d;
  }catch(e){
    console.error('[MAP] Worker request FAILED \u2014 no demo fallback:',e.message);
    setSrcBadge(false,e.message);
    showWorkerError(e.message);
    return {ok:false,companies:[]};
  }
}

function cityLL(city,state){
  const st=(state||"").toUpperCase();
  const centroid=SC[st]?{lat:SC[st].lat,lng:SC[st].lng,s:st}:null;
  if(!city) return centroid||CITIES.find(c=>c.s===st)||null;
  const k=city.toLowerCase().trim();
  const exact=CITIES.find(c=>c.c.toLowerCase()===k&&c.s===st);
  if(exact) return exact;
  // fallback to state geographic center, never the first city in the array
  return centroid||CITIES.find(c=>c.s===st)||null;
}

// ── Map init ──────────────────────────────────────────────────────────────
function initMap(){
  const svg=d3.select('#map');
  // Guard: if booted inside a hidden/collapsed drawer, use a sane fallback; refit() corrects on resize
  const W=Math.max(window.innerWidth,320),H=Math.max(window.innerHeight,240);
  // Fit entire US (incl Alaska/Hawaii insets) in the visible area below the nav bar
  const NAV=96, fitScale=Math.min(W/960,(H-NAV)/600)*1070*0.9;
  projection=d3.geoAlbersUsa().scale(fitScale).translate([W/2,(H+NAV)/2]);
  path=d3.geoPath().projection(projection);

  let zoomRAF=null;
  function applyCounterScale(){
    const k=currentScale, inv=1/k;
    // One transform per dot group — covers core, rings, and glow in a single GPU-friendly op
    gDots.selectAll('.dot-g').each(function(){
      const el=d3.select(this);
      el.attr('transform',`translate(${el.attr('data-x')},${el.attr('data-y')}) scale(${inv})`);
    });
    gPins.selectAll('.state-pin-group').each(function(){
      const el=d3.select(this);
      const pinScale=Math.min(1,Math.max(0.55,inv));
      el.attr('transform',`translate(${+el.attr('data-x')},${+el.attr('data-y')}) scale(${pinScale})`);
    });
    gCities.selectAll('.city-core').each(function(){
      const n=+d3.select(this).attr('data-n')||1;
      d3.select(this).attr('r',Math.min(2.5+n*0.7,7)*inv);
    });
    gCities.selectAll('.city-label').each(function(){
      const base=+d3.select(this).attr('data-fs')||9;
      d3.select(this).style('font-size',base*inv+'px');
    });
  }
  zoomBehavior=d3.zoom().scaleExtent([1,16]).translateExtent([[-100,-60],[W+100,H+60]]).on('zoom',e=>{
    gScene.attr('transform',e.transform);
    currentScale=e.transform.k;
    // Throttle per-element counter-scaling to animation frames — smooth at any prospect count
    if(!zoomRAF){zoomRAF=requestAnimationFrame(()=>{zoomRAF=null;applyCounterScale();});}
  });
  svg.call(zoomBehavior);

  gScene =svg.append('g');
  gStates=gScene.append('g').attr('id','gstates');
  gSignals=gScene.append('g').attr('id','gsignals');
  gDots  =gScene.append('g').attr('id','gdots');
  gPins  =gScene.append('g').attr('id','gpins');
  gCities=gScene.append('g').attr('id','gcities');

  document.getElementById('zi').onclick=()=>svg.transition().duration(280).call(zoomBehavior.scaleBy,1.5);
  document.getElementById('zo').onclick=()=>svg.transition().duration(280).call(zoomBehavior.scaleBy,0.67);
  document.getElementById('zr').onclick=()=>{clearState();svg.transition().duration(450).call(zoomBehavior.transform,d3.zoomIdentity);};

  function refit(){
    const W=window.innerWidth,H=window.innerHeight;
    if(W<50||H<50)return; // drawer hidden — wait for a real viewport
    const NAV=96, fitScale=Math.min(W/960,(H-NAV)/600)*1070*0.9;
    projection.scale(fitScale).translate([W/2,(H+NAV)/2]);
    zoomBehavior.translateExtent([[-100,-60],[W+100,H+60]]);
    gStates.selectAll('.state-fill').attr('d',path);
    gStates.select('.state-border').attr('d',path);
    redrawDots();redrawPins();
    if(selectedState)clearState();
  }
  window.addEventListener('resize',refit);
}

// ── Render states with heat ───────────────────────────────────────────────
function renderStates(us,byState){
  if(typeof topojson === 'undefined'){ console.error('[MAP] topojson missing in renderStates'); return; }
  const feats=topojson.feature(us,us.objects.states);
  const mesh =topojson.mesh(us,us.objects.states,(a,b)=>a!==b);
  const counts=Object.fromEntries(Object.entries(byState).map(([k,v])=>[k,v.length]));
  const max=Math.max(...Object.values(counts),1);

  gStates.selectAll('.state-fill')
    .data(feats.features).enter().append('path')
    .attr('class',d=>{
      const abbr=FIPS[d.id.toString().padStart(2,'0')]||'';
      const n=counts[abbr]||0;
      const heat=n===0?'':n/max<0.1?'heat1':n/max<0.25?'heat2':n/max<0.5?'heat3':n/max<0.75?'heat4':'heat5';
      return 'state-fill'+(heat?' '+heat:'');
    })
    .attr('d',path)
    .attr('data-abbr',d=>FIPS[d.id.toString().padStart(2,'0')]||'')
    .on('click',function(event,d){
      const abbr=FIPS[d.id.toString().padStart(2,'0')];
      if(!abbr)return;
      if(selectedState===abbr){clearState();return;}
      pingState();
      selectState(abbr,d,byState[abbr]||[]);
    });

  gStates.append('path').datum(mesh).attr('class','state-border').attr('d',path);
}

// ── Redraw dots (with radar sweep animation on first render) ──────────────
let firstRender=true;
function redrawDots(){
  gDots.selectAll('*').remove();
  gSignals.selectAll('*').remove();
  const cos=visibleCompanies();

  // Sort by lng so radar sweep goes left→right
  const sorted=[...cos].sort((a,b)=>{
    const la=cityLL(a.city,a.state),lb=cityLL(b.city,b.state);
    return ((la?la.lng:-180)-(lb?lb.lng:-180));
  });

  sorted.forEach((c,i)=>{
    const ll=cityLL(c.city,c.state);
    if(!ll)return;
    const proj=projection([ll.lng,ll.lat]);
    if(!proj)return;

    const col=COL[c.outcome]||COL.NA;
    const isActive=c.outcome&&c.outcome!=='NA';
    const r=c.type==='contact'?(isActive?4:2.5):(isActive?5:3);
    const delay=firstRender?(i*18):0; // staggered ms on first render

    const jx=Math.sin(i*2.39996)*4+Math.cos(i*1.618)*2, jy=Math.cos(i*2.39996)*4+Math.sin(i*1.618)*2;
    const dx=proj[0]+jx, dy=proj[1]+jy;
    const g=gDots.append('g').attr('class',isActive?'dot-g dot-active':'dot-g')
      .attr('data-x',dx).attr('data-y',dy)
      .attr('transform',`translate(${dx},${dy}) scale(${1/currentScale})`);

    if(isActive){
      const rd=(i*0.09)%3.2;
      addRing(g, col, 0);
      addRing(g, col, 0.33);
      addRing(g, col, 0.66);
    }

    const baseOpacity=c.type==='contact'?0.75:1;
    const core=g.append('circle').attr('class','dot-core').attr('r',r).attr('fill',col)
      .style('opacity',0)
      .style('filter',isActive?`drop-shadow(0 0 5px ${col}) drop-shadow(0 0 2px ${col})`:'none');

    if(firstRender){
      setTimeout(()=>{
        core.style('opacity',baseOpacity);
      },delay);
    } else {
      core.style('opacity',baseOpacity);
    }

    g.on('mouseenter',function(event){pingDot();showTip(event,c);drawSignals(proj,c.state);})
     .on('mousemove',moveTip)
     .on('mouseleave',function(){hideTip();gSignals.selectAll('*').remove();});
  });

  if(firstRender)firstRender=false;
}

// ── Signal lines on hover ─────────────────────────────────────────────────
function drawSignals(origin,state){
  gSignals.selectAll('*').remove();
  const nearby=allCompanies.filter(c=>c.state===state).slice(0,8);
  nearby.forEach((c,i)=>{
    const ll=cityLL(c.city,c.state);
    if(!ll)return;
    const proj=projection([ll.lng,ll.lat]);
    if(!proj)return;
    const col=COL[c.outcome]||COL.NA;
    const line=gSignals.append('line').attr('class','signal-line')
      .attr('x1',origin[0]).attr('y1',origin[1])
      .attr('x2',proj[0]).attr('y2',proj[1])
      .attr('stroke',col)
      .style('animation','signalin 0.8s ease-out '+(i*0.06)+'s forwards');
  });
}

// ── State pins (floating stat cards on high-density states) ───────────────
const PIN_STATES=['IA','IL','WI','MN','MO','OH','MI','IN'];
function redrawPins(){
  return; // COD-mode: pins disabled — individual dots only
  gPins.selectAll('*').remove();
  if(selectedState)return;
  const byState={};
  allCompanies.forEach(c=>{if(!byState[c.state])byState[c.state]=[];byState[c.state].push(c);});

  PIN_STATES.forEach(abbr=>{
    const cs=byState[abbr];
    if(!cs||!cs.length)return;
    const anchor=CITIES.find(c=>c.s===abbr);
    if(!anchor)return;
    const proj=projection([anchor.lng,anchor.lat]);
    if(!proj)return;

    const hot=cs.filter(c=>c.outcome==='HOT').length;
    const warm=cs.filter(c=>c.outcome==='WARM').length;
    const unt=cs.filter(c=>!c.outcome||c.outcome==='NA').length;

    const g=gPins.append('g').attr('class','state-pin-group')
      .attr('data-x', proj[0]).attr('data-y', proj[1]-14)
      .attr('transform',`translate(${proj[0]},${proj[1]-14}) scale(${Math.min(1,Math.max(0.55,1/currentScale))})`);

    const w=52,h=18,ox=-w/2;
    g.append('line').attr('class','pin-stem').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',14);
    g.append('rect').attr('class','pin-bg').attr('x',ox).attr('y',-h).attr('width',w).attr('height',h).attr('rx',2);
    g.append('text').attr('class','pin-label').attr('x',ox+4).attr('y',-h+6)
      .text(abbr+' '+cs.length);
    // mini color bars
    const barW=w-8,barH=3,barY=-h+10;
    const total=cs.length||1;
    g.append('rect').attr('x',ox+4).attr('y',barY).attr('width',barW).attr('height',barH).attr('fill','rgba(255,255,255,0.06)').attr('rx',1);
    if(hot) g.append('rect').attr('x',ox+4).attr('y',barY).attr('width',barW*hot/total).attr('height',barH).attr('fill','#ff4040').attr('rx',1);
    if(warm) g.append('rect').attr('x',ox+4+barW*hot/total).attr('y',barY).attr('width',barW*warm/total).attr('height',barH).attr('fill','#e36b1e').attr('rx',0);
  });
}

// ── State select ──────────────────────────────────────────────────────────
function selectState(abbr,feature,contacts){
  selectedState=abbr;
  d3.selectAll('.state-fill').classed('selected',false);
  d3.selectAll(`.state-fill[data-abbr="${abbr}"]`).classed('selected',true);
  gPins.selectAll('*').remove();
  gDots.transition().duration(400).style('opacity',0.12);

  const [[x0,y0],[x1,y1]]=path.bounds(feature);
  const W=window.innerWidth,H=window.innerHeight;
  const sc=Math.min(10,0.85/Math.max((x1-x0)/(W-240),(y1-y0)/(H-160)));
  const tx=(W-(x0+x1)*sc)/2+100, ty=((H+90)-(y0+y1)*sc)/2;
  d3.select('#map').transition().duration(650).ease(d3.easeCubicInOut)
    .call(zoomBehavior.transform,d3.zoomIdentity.translate(tx,ty).scale(sc));

  setTimeout(()=>{stopRings();showCityLayer(abbr,contacts,sc);startRings();},700);
  openPanel(abbr,contacts);
  showCityChart(abbr,contacts);
}

function clearState(){
  selectedState=null;
  gDots.transition().duration(400).style('opacity',1);
  d3.selectAll('.state-fill').classed('selected',false);
  gCities.selectAll('*').remove();
  closePanel();
  hideCityChart();
  redrawPins();
  d3.select('#map').transition().duration(500).call(zoomBehavior.transform,d3.zoomIdentity);
}

// ── City layer on drill-down ──────────────────────────────────────────────
function showCityLayer(stateAbbr,contacts,sc){
  gCities.selectAll('*').remove();
  _cityLayerData = []; // reset for proximity lookup
  hideCityPopover();

  const byCity={};
  contacts.forEach(c=>{if(!byCity[c.city])byCity[c.city]=[];byCity[c.city].push(c);});
  const stateCities=CITIES.filter(c=>c.s===stateAbbr);

  stateCities.forEach((city,ci)=>{
    const proj=projection([city.lng,city.lat]);
    if(!proj)return;
    const cts=byCity[city.c]||[];
    const has=cts.length>0;
    const hot=cts.filter(c=>c.outcome==='HOT').length;
    const warm=cts.filter(c=>c.outcome==='WARM').length;
    const col=hot?COL.HOT:warm?COL.WARM:has?COL.COLD:'rgba(56,189,248,0.15)';
    const r=(has?Math.min(2.5+cts.length*0.7,7):1.2)/currentScale;
    const fs=9;

    // Store for proximity lookup
    _cityLayerData.push({ city:city.c, stateAbbr, cts, px:proj[0], py:proj[1] });

    const g=gCities.append('g').attr('class','city-g')
      .attr('transform',`translate(${proj[0]},${proj[1]})`);

    if(has&&cts.some(c=>c.outcome&&c.outcome!=='NA')){
      addRing(g, col, (ci*0.08)%1);
    }

    // Hit area — bigger invisible circle for easier clicking
    g.append('circle').attr('r', Math.max(r*2, 8/currentScale))
      .attr('fill','transparent').attr('stroke','none');

    g.append('circle').attr('class','city-core').attr('r',r).attr('data-n',cts.length).attr('fill',col)
      .style('opacity',0).style('filter',has?`drop-shadow(0 0 4px ${col})`:'none')
      .style('animation-delay',ci*0.05+'s');

    // Label — shows on hover with bigger size
    const label = g.append('text').attr('class','city-label').attr('y',-(r+3.5)).attr('data-fs',fs)
      .attr('text-anchor','middle').style('font-size',fs/currentScale+'px')
      .style('font-weight',has?'700':'400').style('letter-spacing','0.04em')
      .style('fill',has?'rgba(255,255,255,0.65)':'rgba(255,255,255,0.18)')
      .text(city.c);

    if(has){
      g.on('mouseenter',function(event){
        pingDot();
        // Brighten label on hover
        label.style('fill','#fff').style('font-size',(fs*1.3)/currentScale+'px');
        showTip(event,cts[0],cts.length);
        // Check for nearby cities and hint via cursor
        const nearby = citiesNear(event.clientX, event.clientY, 28);
        if(nearby.length > 1) {
          // Show mini count badge next to cursor
          tip.querySelector && null; // handled by tip
        }
      })
      .on('mousemove',function(event){ moveTip(event); })
      .on('mouseleave',function(){
        label.style('fill',has?'rgba(255,255,255,0.65)':'rgba(255,255,255,0.18)')
             .style('font-size',fs/currentScale+'px');
        hideTip();
      })
      .on('click',function(event){
        event.stopPropagation();
        hideCityPopover();
        // Check if other cities are very close — if so show popover
        const nearby = citiesNear(event.clientX, event.clientY, 28);
        if(nearby.length > 1) {
          showCityPopover(nearby, event.clientX, event.clientY);
        } else {
          pingState();
          openCityPanel(city.c, stateAbbr, cts);
        }
      });
    } else {
      // No contacts — still show popover if nearby cities exist
      g.on('click',function(event){
        event.stopPropagation();
        const nearby = citiesNear(event.clientX, event.clientY, 28).filter(d=>d.cts.length>0);
        if(nearby.length) showCityPopover(nearby, event.clientX, event.clientY);
      });
    }
  });
}

function showCityChart(stateAbbr,contacts){

  const sorted=Object.entries(byCity).sort((a,b)=>b[1]-a[1]).slice(0,8);

    `<div class="bar-row">
      <div class="bar-city">${city}</div>
      <div class="bar-track"><div class="bar-fill" style="width:0%;transition:width 0.7s ease" data-w="${n/max*100}"></div></div>
      <div class="bar-n">${n}</div>

// ── JS Ring Animator ─────────────────────────────────────────────────────
// Replaces CSS keyframes so rings always scale with currentScale.
// Each ring stores: { el, phase, delay, speed, color }
const activeRings = [];
let rafRunning = false;

function addRing(parentG, color, delayFrac) {
  const el = document.createElementNS('http://www.w3.org/2000/svg','circle');
  el.setAttribute('fill','none');
  el.setAttribute('stroke', color);
  el.setAttribute('r', '0');
  el.setAttribute('stroke-width', '0.7');
  el.setAttribute('opacity','0');
  parentG.node().appendChild(el);
  const CYCLE_MS = 2800;
  // startTime in the past so each ring starts at a different phase offset
  const startTime = performance.now() - delayFrac * CYCLE_MS;
  activeRings.push({ el, startTime, color });
  return el;
}

function tickRings() {
  if(!rafRunning) return;
  const k    = currentScale || 1;
  const BASE = 1;
  const MAX  = 16;
  const CYCLE_MS = 2800; // one full ring cycle = 2.8 seconds, always

  // Wall-clock time — immune to zoom frame bursts
  const now = performance.now();

  activeRings.forEach(ring => {
    // phase = (time offset by delay) / cycle length, always 0→1 in real time
    const elapsed = now - ring.startTime;
    if(elapsed < 0) { ring.el.setAttribute('opacity','0'); return; }
    const p = (elapsed % CYCLE_MS) / CYCLE_MS;

    const r  = BASE + (MAX - BASE) * p;
    const op = Math.max(0, 0.9 * (1 - p * p));
    ring.el.setAttribute('r',            (r / k).toFixed(3));
    ring.el.setAttribute('stroke-width', (0.7 / k).toFixed(3));
    ring.el.setAttribute('opacity',      op.toFixed(3));
  });
  requestAnimationFrame(tickRings);
}

function startRings() {
  if(rafRunning) return;
  rafRunning = true;
  requestAnimationFrame(tickRings);
}

function stopRings() {
  rafRunning = false;
  activeRings.length = 0;
}


// ── FEATURE 1: Hover shows city name prominently ─────────────────────────

// ── FEATURE 2: Nearest-city snap on click ────────────────────────────────
// Store city data for proximity lookup
let _cityLayerData = []; // [{city, stateAbbr, cts, px, py}]

function nearestCity(mx, my, maxScreenPx) {
  // mx/my are screen coords — convert to map coords
  const t  = d3.zoomTransform(d3.select('#map').node());
  const mk = t.k, mtx = t.x, mty = t.y;
  // map px = (screen - translate) / scale
  const mapX = (mx - mtx) / mk;
  const mapY = (my - mty) / mk;
  const threshold = maxScreenPx / mk; // in map units

  let best = null, bestD = Infinity;
  _cityLayerData.forEach(d => {
    const dx = d.px - mapX, dy = d.py - mapY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < threshold && dist < bestD) { bestD = dist; best = d; }
  });
  return best;
}

function citiesNear(mx, my, maxScreenPx) {
  const t  = d3.zoomTransform(d3.select('#map').node());
  const mk = t.k, mtx = t.x, mty = t.y;
  const mapX = (mx - mtx) / mk;
  const mapY = (my - mty) / mk;
  const threshold = maxScreenPx / mk;

  return _cityLayerData
    .filter(d => {
      const dx = d.px - mapX, dy = d.py - mapY;
      return Math.sqrt(dx*dx + dy*dy) < threshold;
    })
    .sort((a,b) => {
      const da = Math.sqrt((a.px-mapX)**2+(a.py-mapY)**2);
      const db = Math.sqrt((b.px-mapX)**2+(b.py-mapY)**2);
      return da - db;
    });
}

// ── FEATURE 3: Popover for dense areas ───────────────────────────────────
const cityPopover = document.getElementById('city-popover');
let popoverOpen = false;

function showCityPopover(cities, screenX, screenY) {
  const list = document.getElementById('pop-list');
  document.getElementById('pop-title').textContent = cities.length + ' cities nearby';
  list.innerHTML = cities.slice(0,8).map(d => {
    const col = d.cts.length === 0 ? 'rgba(56,189,248,0.3)'
      : d.cts.some(c=>c.outcome==='HOT') ? '#ff4040'
      : d.cts.some(c=>c.outcome==='WARM') ? '#e36b1e' : '#38bdf8';
    const n = d.cts.length;
    return `<div class="pop-city" data-city="${d.city}" data-state="${d.stateAbbr}">
      <div class="pc-dot" style="background:${col}"></div>
      <div class="pc-name">${d.city}</div>
      <div class="pc-meta">${n ? n+' co.' : 'no data'}</div>
    </div>`;
  }).join('');

  // Position — keep on screen
  const pw = 240, ph = Math.min(cities.length, 8) * 36 + 40;
  const W = window.innerWidth, H = window.innerHeight;
  cityPopover.style.left = Math.min(screenX + 12, W - pw - 8) + 'px';
  cityPopover.style.top  = Math.min(screenY - 20, H - ph - 8) + 'px';
  cityPopover.style.display = 'block';
  popoverOpen = true;

  // Wire clicks
  cityPopover.querySelectorAll('.pop-city').forEach(el => {
    el.addEventListener('click', () => {
      const city = el.dataset.city;
      const state = el.dataset.state;
      const d = _cityLayerData.find(x => x.city === city && x.stateAbbr === state);
      if(d && d.cts.length) {
        pingState();
        openCityPanel(city, state, d.cts);
      }
      hideCityPopover();
    });
  });
}

function hideCityPopover() {
  cityPopover.style.display = 'none';
  popoverOpen = false;
}

// Click on map background (not a dot) — show nearby popover
d3.select('#map').on('click.citymap', function(event) {
  if(!selectedState || !_cityLayerData.length) return;
  if(event.target.closest('.city-g')) return; // let city dots handle their own click
  if(popoverOpen) { hideCityPopover(); return; }

  const nearby = citiesNear(event.clientX, event.clientY, 40);
  if(nearby.length > 1) {
    showCityPopover(nearby, event.clientX, event.clientY);
  } else if(nearby.length === 1 && nearby[0].cts.length) {
    pingState();
    openCityPanel(nearby[0].city, nearby[0].stateAbbr, nearby[0].cts);
  }
});

// Close popover on outside click
document.addEventListener('click', e => {
  if(popoverOpen && !e.target.closest('#city-popover')) hideCityPopover();
});

async function boot(){
  console.log('[MAP] boot started, d3:', typeof d3, 'topojson:', typeof topojson);
  lp(10,'CONNECTING TO CRM NETWORK...');
  const [usData,crmData]=await Promise.all([
    fetch('/sales-ops/shared/states-10m.json').then(r=>r.json()),
    fetchCRM()
  ]);

  console.log('[MAP] data loaded, companies:', (crmData.companies||[]).length, 'contacts:', (crmData.contacts||[]).length);
  lp(55,'PROCESSING '+( (crmData.companies||[]).length)+' COMPANIES...');
  allCompanies=crmData.companies||[];
  allContacts=crmData.contacts||[];
  stats=crmData.stats||{};

  const byState={};
  allCompanies.forEach(c=>{if(!byState[c.state])byState[c.state]=[];byState[c.state].push(c);});

  console.log('[MAP] rendering map, byState keys:', Object.keys(byState).length);
  lp(75,'RENDERING MAP...');
  initMap();
  renderStates(usData,byState);

  lp(88,'PLOTTING '+allCompanies.length+' CONTACTS...');
  stopRings();
  redrawDots();
  startRings();
  redrawPins();
  updateHUD(stats);
  buildTicker(allCompanies);

  console.log('[MAP] systems online — done');
  lp(100,'SYSTEMS ONLINE');
  await new Promise(r=>setTimeout(r,350));
  var loader=document.getElementById('loader');
  if(loader){loader.style.opacity='0';setTimeout(()=>{loader.style.display='none';},600);}

  // Auto-refresh
  setInterval(async()=>{
    const d=await fetchCRM();
    if(!d.ok)return;
    allCompanies=d.companies||[];
    allContacts=d.contacts||[];
    stats=d.stats||{};
    const bs={};
    allCompanies.forEach(c=>{if(!bs[c.state])bs[c.state]=[];bs[c.state].push(c);});
    stopRings();
    redrawDots();
    startRings();
    if(!selectedState)redrawPins();
    updateHUD(stats);
    buildTicker(allCompanies);
  },REFRESH);
}

    boot().catch(function(e){ console.error('[MAP] boot failed:', e); });
  });
} else {
  boot().catch(function(e){ console.error('[MAP] boot failed:', e); });
}
