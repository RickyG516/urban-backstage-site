<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <script>
    (function() {
      var w = (window.screen && window.screen.width) || window.innerWidth;
      if (w < 600 || /iPhone|Android.*Mobile|iPod/i.test(navigator.userAgent)) document.documentElement.setAttribute('data-mobile', 'phone');
      else if (w < 900) document.documentElement.setAttribute('data-mobile', 'tablet');
    })();
  </script>

  <!-- GHOST PAGE — do not index -->
  <meta name="robots" content="noindex, nofollow, noarchive, nositelinkssearchbox" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>Re-Engage Cockpit — UNC Sales Ops</title>
  <meta name="description" content="Internal sales operations cockpit. Not for public use." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/sales-ops/shared/cockpit-shell.css?v=43" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- HubSpot Tracking Code -->
  <script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/245833525.js"></script>
</head>
<body>

  <main class="cockpit" data-cockpit="re-engage" role="application" aria-label="Re-Engage Cockpit">

    <!-- ===== HUD ===== -->
    <header class="hud" role="banner">
      <div class="hud__brand">
        <a href="/sales-ops/" class="hud__logo" style="text-decoration:none">Urban Niche<span>.</span></a>
        <div class="hud__cockpit-name">Re-Engage · v1</div>
      </div>

      <div class="hud__center">
        <div class="rep-selector">
          <span class="rep-selector__label">Rep</span>
          <select id="rep-select" class="rep-selector__select" aria-label="Active rep"></select>
        </div>
        <div class="hud__stat" title="Call duration — auto-starts on first branch click">
          <span class="hud__stat-label">Time</span>
          <span id="call-timer" class="hud__stat-value">00:00</span>
        </div>
        <div class="hud__stat" title="Re-engage dials logged today">
          <span class="hud__stat-label">Dials</span>
          <span id="dial-count" class="hud__stat-value hud__stat-value--accent">0</span>
        </div>
      </div>

      <div class="hud__right">
        <div id="sync-status" class="hud__sync" data-status="local" title="LIVE: calls syncing to HubSpot&#10;LOCAL ONLY: worker offline">
          <span class="hud__sync-dot"></span>
          <span id="sync-status-text">Local Only</span>
        </div>
        <div class="hud__sync-badge">
          <button id="sync-toggle" class="hud__icon-btn" title="Sync to HubSpot" aria-label="Sync to HubSpot">📤</button>
          <span id="sync-badge" class="sync-badge" hidden>0</span>
        </div>
        <button id="audio-toggle" class="hud__icon-btn" title="Toggle audio cues" aria-label="Toggle audio">🔊</button>
        <button id="stats-toggle" class="hud__icon-btn" title="Session stats" aria-label="Stats">📊</button>
        <button id="csv-export" class="hud__icon-btn" title="Export CSV" aria-label="Export CSV">⬇</button>
      </div>
    </header>

    <!-- ===== STAGE ===== -->
    <div class="main">
      <div class="col-script">
        <div class="screen-lbl" id="screen-lbl-el">Re-Engage</div>
        <section id="screen-stage" class="screen active" data-screen="start" aria-live="polite">
          <div class="script-panel"><div class="script-panel__line">Loading cockpit…</div></div>
        </section>
      </div>
      <div class="col-right">
        <div id="prospect-card" class="prospect-card" hidden></div>
        <div id="queue-banner" class="queue-banner" hidden></div>
        <div class="call-notes-panel" id="call-notes-panel" hidden>
          <div class="call-notes-panel__lbl">Call Notes</div>
          <textarea id="call-notes" class="notes-area" placeholder="Key details, objections, what they said — saved per contact."></textarea>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="foot" role="contentinfo">
      <div class="foot__left">
        <button id="nav-back" class="action-btn" aria-label="Back (Esc)">← Back</button>
        <button id="nav-restart" class="action-btn" aria-label="Start over (Space)">↻ Start Over</button>
      </div>
      <div class="foot__divider"></div>
      <div id="outcome-buttons" class="foot__outcomes" hidden aria-label="Log call outcome"></div>
    </footer>

  </main>

  <script src="/sales-ops/shared/cockpit-shell.js?v=50"></script>
  <script src="/sales-ops/re-engage/content.js?v=3"></script>

  <script src="/sales-ops/shared/unc-key.js"></script>
</body>
</html>
