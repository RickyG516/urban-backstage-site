<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Rep Dashboard — Sales Ops</title>
  <link rel="stylesheet" href="/sales-ops/shared/cockpit-shell.css?v=43" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    .rep-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-top:1.25rem; }
    @media (max-width:640px) { .rep-grid { grid-template-columns:1fr; } }
    .rep-card { background:var(--color-dark); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:1.5rem; }
    .rep-card__name { font-size:1rem; font-weight:700; color:var(--color-white); margin-bottom:0.2rem; }
    .rep-card__role { font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--color-white-dim); margin-bottom:1.25rem; }
    .rep-stat { display:flex; justify-content:space-between; align-items:center; padding:0.45rem 0; border-bottom:1px solid var(--color-border); }
    .rep-stat:last-of-type { border-bottom:none; }
    .rep-stat__label { font-size:0.8rem; color:var(--color-white-dim); }
    .rep-stat__val { font-size:1rem; font-weight:700; color:var(--color-white); }
    .rep-stat__val.hot { color:#22c55e; }
    .rep-stat__val.warm { color:var(--color-accent); }
    .rep-stat__val.rate { color:#fbbf24; }
    .goal-bar { height:6px; background:var(--color-dark-3); border-radius:3px; overflow:hidden; margin-top:1rem; }
    .goal-bar__fill { height:100%; border-radius:3px; transition:width 0.4s; }
    .goal-label { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--color-white-dim); margin-top:0.3rem; }
    .rep-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .rep-header-row { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.2rem; }
    .loading-msg { color:var(--color-white-dim); font-size:0.85rem; text-align:center; padding:2rem; }
    .last-updated { font-size:0.72rem; color:var(--color-white-dim); text-align:right; margin-top:1rem; }
  </style>
  <script src="/sales-ops/shared/nav-shell.js?v=40" defer></script>
<!-- HubSpot Tracking Code -->
<script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/245833525.js"></script>
</head>
<body>
<main class="cockpit">
  <section class="dash">
    <div class="dash__header">
      <div>
        <h1 class="dash__title">Rep Dashboard</h1>
        <p class="dash__sub">Live dial counts and HOT/WARM rates side by side. Refreshes every 60 seconds. <span id="data-source-badge" style="font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:3px;background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.25);">HubSpot Live</span></p>
      </div>
      <div class="dash__filters">
        <button class="dash__filter-btn active" data-range="today">Today</button>
        <button class="dash__filter-btn" data-range="week">This Week</button>
        <button class="dash__filter-btn" data-range="month">This Month</button>
      </div>
    </div>
    <div id="rep-grid" class="rep-grid">
      <div class="loading-msg">Loading rep data...</div>
    </div>
    <div class="last-updated" id="last-updated"></div>
  </section>
</main>
<script>
(function() {
  let currentRange = 'today';

  const HOT_CODES  = new Set(['HOT','BOOKED','CLOSED_WON','FOLLOW_UP_BOOKED','PROPOSAL_REQUESTED']);
  const WARM_CODES = new Set(['WARM','INFO_SENT']);
  const COLD_CODES = new Set(['COLD','COLD-GK','WRG','DNC','VOICEMAIL','WRONG_NUMBER','GATEKEEPER','PARK']);

  function allLocalCalls() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('unc_cockpit_call_log_')) {
        try { out.push(...JSON.parse(localStorage.getItem(k))); } catch(e) {}
      }
    }
    return out;
  }

  function filterByRange(calls, range) {
    const now = Date.now();
    const cutoff = range === 'today' ? new Date().setHours(0,0,0,0) :
                   range === 'week'  ? now - 7*86400000 :
                   range === 'month' ? now - 30*86400000 : 0;
    return cutoff ? calls.filter(c => new Date(c.timestamp).getTime() >= cutoff) : calls;
  }

  function fetchStats(rep) {
    try {
      const calls = filterByRange(allLocalCalls(), currentRange).filter(c => c.rep_id === rep.id);
      const hot_count  = calls.filter(c => HOT_CODES.has(c.outcome_code)).length;
      const warm_count = calls.filter(c => WARM_CODES.has(c.outcome_code)).length;
      return { dials_total: calls.length, hot_count, warm_count };
    } catch(e) { return null; }
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function getRepGoal(id, def) {
    try { const r=localStorage.getItem('unc_daily_goal_'+id); if(!r) return def||10; const o=JSON.parse(r); return o.date===todayKey()?(o.goal||def||10):(def||10); } catch(e){return def||10;}
  }

  async function init() {
    const repsData = await fetch('/sales-ops/shared/reps.json', { cache:'no-cache' }).then(r=>r.json()).catch(()=>null);
    const reps = (repsData && repsData.reps) ? repsData.reps.filter(r=>r.active) : [];

    function render() {
      const grid = document.getElementById('rep-grid');
      const results = reps.map(rep => {
        const stats  = fetchStats(rep);
        const dials  = stats ? stats.dials_total : 0;
        const hot    = stats ? stats.hot_count  : 0;
        const warm   = stats ? stats.warm_count : 0;
        const goal   = getRepGoal(rep.id, rep.dial_target);
        const rate   = dials > 0 ? Math.round(((hot+warm)/dials)*100) : 0;
        const pct    = Math.min(100, Math.round((dials/goal)*100));
        return '<div class="rep-card" style="border-top:3px solid '+rep.color+';" data-source="local">' +
          '<div class="rep-header-row"><div class="rep-dot" style="background:'+rep.color+';"></div><div class="rep-card__name">'+rep.display_name+'</div></div>' +
          '<div class="rep-card__role">'+rep.role+'</div>' +
          '<div class="rep-stat"><span class="rep-stat__label">Dials</span><span class="rep-stat__val">'+dials+'</span></div>' +
          '<div class="rep-stat"><span class="rep-stat__label">Goal</span><span class="rep-stat__val">'+goal+'</span></div>' +
          '<div class="rep-stat"><span class="rep-stat__label">HOT</span><span class="rep-stat__val hot">'+hot+'</span></div>' +
          '<div class="rep-stat"><span class="rep-stat__label">WARM</span><span class="rep-stat__val warm">'+warm+'</span></div>' +
          '<div class="rep-stat"><span class="rep-stat__label">Conv. Rate</span><span class="rep-stat__val rate">'+rate+'%</span></div>' +
          '<div class="goal-bar"><div class="goal-bar__fill" style="width:'+pct+'%;background:'+(pct>=100?'#22c55e':rep.color)+';"></div></div>' +
          '<div class="goal-label"><span>Goal progress</span><span>'+pct+'%</span></div>' +
          '</div>';
      });
      grid.innerHTML = results.join('') || '<div class="loading-msg">No reps configured.</div>';
      document.getElementById('last-updated').textContent = 'Last updated: '+new Date().toLocaleTimeString();
      const badge = document.getElementById('data-source-badge');
      if (badge) {
        badge.textContent = 'Local';
        badge.style.color = '#fbbf24';
        badge.style.borderColor = 'rgba(251,191,36,0.25)';
        badge.style.background = 'rgba(251,191,36,0.1)';
      }
    }

    document.querySelectorAll('[data-range]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-range]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;
        render();
      });
    });

    render();
    setInterval(render, 60000);
  }

  init();
})();
</script>
</body>
</html>
