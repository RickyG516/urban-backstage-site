<text x="120" y="888" font-size="12" fill="#ffffff">Footprint 14 x 12 ft, 8 ft walls. Sides still fit at 11 ft deep if the fence gap is short.</text>
<text x="120" y="906" font-size="12" fill="#ffffff">Sides match: 4 lites over 6 lites, bays framed 36 1/2, 1 1/4 in fillers beside each 34 in sash.</text>
<text x="120" y="924" font-size="12" fill="#ffffff">Double 2x4 posts, 2-2x10 header, flat 2x4 mid rail. Front: 2 stacked W-D each side, safety glazed.</text>
<text x="120" y="942" font-size="12" fill="#ffffff">Back: 2 high sashes, 6 1/2 ft solid decor wall, exhaust fan in the back gable.</text>
<text x="120" y="960" font-size="12" fill="#ffffff">Placement vs fence open: master plan 3 ft, manual 3 in. Measure before the pad.</text>
