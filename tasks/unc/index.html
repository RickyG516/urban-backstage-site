<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f0f0f">
<title>Business tasks | Urban Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tasks/unc/os.css?v=202611250500">
<style>
body{margin:0;background:#0f0f0f;color:#f5f5f5;font-family:'Open Sans',Arial,sans-serif}
a{text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top a{color:#8e8e8e;font-size:13px}
h1{font:700 28px Montserrat,Arial,sans-serif;margin:0}h1 span{color:#e36b1e}
.sub{color:#8e8e8e;font-size:14px;margin:6px 0 18px}
.go{display:flex;gap:6px;flex-wrap:wrap}
.go a{font:700 12.5px Montserrat,Arial,sans-serif;padding:7px 12px;border-radius:999px;border:1px solid #333;color:#cfcfcf}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">&larr; Hub</a><div class="go"><a href="/sales-ops/tasks/">Client tasks (HubSpot)</a><a href="/tasks/">All tasks</a></div></div>
  <h1>Business <span>tasks</span></h1>
  <p class="sub">Everything UNC has to do for itself: sales system, content, infrastructure, money, goals. Client work stays in HubSpot. Tap the box to close a task, tap the words to edit it.</p>
  <div class="os-stats" data-os="stats"></div>
  <div class="os-filters" data-os="filters"></div>
  <div class="os-bar2"><button data-os-st="open" class="on">Open</button><button data-os-st="done">Closed</button><input data-os="search" placeholder="Search business tasks"></div>
  <div data-os="list"><p class="os-muted">Loading…</p></div>
  <form class="os-add" data-os="add">
    <input name="title" placeholder="Add a business task" required maxlength="250">
    <select name="area"><option value="">Department</option><option value="revenue">Revenue &amp; Growth</option><option value="clients">Client Success</option><option value="delivery">Delivery &amp; Ops</option><option value="content">Content &amp; Brand</option><option value="finance">Finance &amp; Admin</option><option value="tech">Tech &amp; Systems</option><option value="goals">Goals</option></select>
    <input name="due" type="date">
    <select name="repeat"><option value="">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
    <button type="submit">Add</button>
  </form>
</div>
<script src="/sales-ops/shared/unc-key.js"></script>
<script src="/tasks/unc/os.js?v=202611250500"></script>
</body>
</html>
