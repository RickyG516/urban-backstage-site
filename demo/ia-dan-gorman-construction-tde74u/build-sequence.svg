<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Animated framing blueprint drawing itself">
<style>
.dw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 11s ease-in-out infinite}
@keyframes draw{
 0%{stroke-dashoffset:100}
 22%{stroke-dashoffset:0}
 82%{stroke-dashoffset:0;opacity:inherit}
 95%{stroke-dashoffset:0;opacity:0}
 100%{stroke-dashoffset:100;opacity:0}
}
.pulse{animation:pl 4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.15}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){
 .dw{animation:none;stroke-dashoffset:0}
 .pulse{animation:none;opacity:.28}
}
</style>
